[package]
name = "agent24-cos72-os"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cos72 domain-OS SKELETON (ME-4) — a second DomainModule, present to prove the kernel boundary is real rather than to implement Cos72"

[dependencies]
agent24-core = { path = "../agent24-core" }        # util only: ulid() + now_iso8601()
agent24-domain = { path = "../agent24-domain" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
